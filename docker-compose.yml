services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: steamlib
      POSTGRES_PASSWORD: steamlib
      POSTGRES_DB: steamlib
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamlib -d steamlib"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
