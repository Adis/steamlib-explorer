services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: steamlib
      POSTGRES_PASSWORD: steamlib
      POSTGRES_DB: steamlib
    ports:
      # Localhost only: Docker's own firewall rules bypass ufw, so a bare
      # "5432:5432" would expose Postgres to the whole network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamlib -d steamlib"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
