<!doctype html>
<!-- GNU Terry Pratchett -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steamlib Explorer</title>
    <script>
      // Apply the theme and accessibility settings saved in Settings before anything renders (see src/theme.ts).
      try {
        var t = localStorage.getItem("theme");
        if (t && t !== "midnight") document.documentElement.dataset.theme = t;
        var s = localStorage.getItem("textSize");
        if (s === "125" || s === "150") document.documentElement.style.fontSize = s + "%";
        var cv = localStorage.getItem("colorVision");
        if (cv === "rg" || cv === "by") document.documentElement.dataset.cv = cv;
        var m = localStorage.getItem("reduceMotion");
        if (m === "on" || (m !== "off" && matchMedia("(prefers-reduced-motion: reduce)").matches))
          document.documentElement.dataset.motion = "reduce";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
