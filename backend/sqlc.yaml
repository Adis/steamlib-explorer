version: "2"
sql:
  - engine: postgresql
    schema: db/postgres/migrations
    queries: db/postgres/queries
    gen:
      go:
        package: postgres
        out: internal/store/postgres
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.bool
            nullable: true
            go_type:
              type: bool
              pointer: true
  # The explorer's queries (ListGames and the facets) are built in Go in
  # internal/store/sqlite/games.go: sqlc's SQLite parser can't handle them.
  - engine: sqlite
    schema: db/sqlite/migrations
    queries: db/sqlite/queries
    gen:
      go:
        package: sqlite
        out: internal/store/sqlite
        emit_empty_slices: true
